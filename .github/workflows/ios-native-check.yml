name: iOS native check

# Builds the iPhone app on a Mac and screenshots its native screens in the
# simulator (the account sheet and every level border), so Swift written
# without a Mac is compiled and looked at before it reaches Xcode Cloud.
# Runs on branches named native-*, or by hand. Xcode Cloud still builds main.
# The build log and screenshots are handed back as branch
# ci/<branch>-results, so they can be read with plain git.

on:
  push:
    branches: ['native-*']
  workflow_dispatch:

permissions:
  contents: write   # to push the results branch

jobs:
  check:
    runs-on: macos-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Use the newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Install packages
        run: npm ci --legacy-peer-deps

      # The screens under test are native; the page behind them only needs
      # the app's backdrop photo (and the theme photos the sheet's swatches use).
      - name: Stand-in web bundle
        env:
          LANG: en_US.UTF-8   # CocoaPods, run by cap sync, needs a UTF-8 locale
        run: |
          mkdir -p out/themes
          cp public/bg.jpeg out/
          cp public/themes/*.jpg out/themes/
          cat > out/index.html <<'EOF'
          <!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head>
          <body style="margin:0;min-height:100vh;background:#1e1b4b url(bg.jpeg) 62% 50%/cover;font-family:-apple-system,sans-serif">
          <!-- A stand-in for a web pop-up, for the native morph (-SprindMorphDemo) -->
          <div id="tile" style="position:fixed;left:24px;top:260px;width:180px;height:96px;border-radius:24px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);color:#fff;display:flex;align-items:center;justify-content:center">Leaderboard</div>
          <div id="back" style="position:fixed;inset:0;background:rgba(0,0,0,.5);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);opacity:0"></div>
          <div id="panel" style="position:fixed;left:16px;right:16px;top:150px;height:620px;border-radius:24px;background:rgba(255,255,255,.1);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,.2);color:#fff;padding:24px;box-sizing:border-box;opacity:0">
          <h2 style="margin:0 0 16px">Leaderboard</h2><p>1. Alex Martin, 12,340 XP</p><p>2. Sam Lee, 11,020 XP</p><p>3. Kim Park, 9,870 XP</p></div>
          <script>
          window.__morphTest = async function () {
            var P = window.Capacitor.Plugins.PanelMorph, tile = document.getElementById('tile'), back = document.getElementById('back'), panel = document.getElementById('panel');
            var rect = function (el) { var r = el.getBoundingClientRect(); return { x: r.left, y: r.top, width: r.width, height: r.height }; };
            await P.freeze();
            back.style.opacity = '1'; panel.style.opacity = '1';
            await new Promise(function (r) { requestAnimationFrame(function () { requestAnimationFrame(r); }); });
            await P.open({ from: rect(tile), fromRadius: 24, to: rect(panel), toRadius: 24 });
          };
          </script>
          </body></html>
          EOF
          set -o pipefail
          npx cap sync ios 2>&1 | tee setup.log

      - name: Build for the simulator
        run: |
          set -o pipefail
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build 2>&1 \
            | tee build.log | grep -E "error:|warning: .*(AccountSheet|LevelAvatar)|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log

      - name: Screenshots
        run: |
          exec > >(tee screenshots.log) 2>&1
          xcrun simctl list devices available --json > devices.json
          DEVICE=$(python3 - <<'PY'
          import json
          best = None
          for runtime, devices in json.load(open("devices.json"))["devices"].items():
              if ".iOS-" not in runtime:
                  continue
              version = tuple(int(part) for part in runtime.split(".iOS-")[-1].split("-") if part.isdigit())
              for device in devices:
                  name = device["name"]
                  if not device.get("isAvailable", True) or not name.startswith("iPhone"):
                      continue
                  score = (version, "Pro Max" in name, "Pro" in name)
                  if best is None or score > best[0]:
                      best = (score, device["udid"], name)
          print(best[1])
          PY
          )
          echo "Simulator: $DEVICE"
          xcrun simctl boot "$DEVICE" || true   # fails harmlessly if it's already up
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl status_bar "$DEVICE" override --time 9:41 --batteryState charged --batteryLevel 100 || true
          xcrun simctl install "$DEVICE" build/Build/Products/Debug-iphonesimulator/App.app
          mkdir -p shots
          shoot() { xcrun simctl io "$DEVICE" screenshot "shots/$1.png" >/dev/null; }
          run() {
            xcrun simctl terminate "$DEVICE" com.sprind.app >/dev/null 2>&1 || true
            xcrun simctl launch "$DEVICE" com.sprind.app "$@"
          }

          # The sheet opening out of its button: the app records its own frames
          # every 40 ms (screenshots from out here are far too slow to catch it).
          # The demo opens 9 s after launch, once the page has surely painted.
          run -SprindAccountDemo -SprindAccountDemoFrames
          sleep 14
          shoot account-top
          DATA=$(xcrun simctl get_app_container "$DEVICE" com.sprind.app data)
          for frame in "$DATA"/Documents/frames/*.png; do cp "$frame" "shots/open-$(basename "$frame")"; done
          for stop in theme offline buttons delete; do
            run -SprindAccountDemo -SprindAccountDemoScroll "$stop"
            sleep 14
            shoot "account-$stop"
          done
          run -SprindAccountDemo -SprindAccountDemoLevel 100
          sleep 13
          shoot account-omniglot

          # A web pop-up opening out of its tile with the native morph
          run -SprindMorphDemo
          sleep 13
          shoot morph-end
          for frame in "$DATA"/Documents/morph/*.png; do cp "$frame" "shots/morph-$(basename "$frame")"; done

          # The level pop-up growing out of the Dynamic Island. The app's own
          # frames can't show the island; this screenshot, with the screen's
          # outline in black, shows the pop-up over it.
          run -SprindIslandDemo
          sleep 10.2
          xcrun simctl io "$DEVICE" screenshot --mask=black shots/island-open.png >/dev/null || shoot island-open
          sleep 3
          shoot island-end
          for frame in "$DATA"/Documents/island/*.png; do cp "$frame" "shots/island-$(basename "$frame")"; done

          # Every border, twice a moment apart: they should have moved
          run -SprindBorderGallery
          sleep 5
          shoot borders-a
          sleep 0.4
          shoot borders-b
          ls -la shots

      - name: Hand the results back
        if: always()
        run: |
          RESULTS=$(mktemp -d)
          mkdir -p "$RESULTS/shots"
          {
            echo "commit: $GITHUB_SHA"
            xcodebuild -version
            grep -E "BUILD (SUCCEEDED|FAILED)" build.log || echo "no build result"
          } > "$RESULTS/summary.txt" 2>&1
          grep -E -B2 -A6 "error:" build.log > "$RESULTS/errors.txt" 2>/dev/null || true
          tail -n 3000 build.log > "$RESULTS/build-tail.log" 2>/dev/null || true
          tail -n 300 setup.log > "$RESULTS/setup-tail.log" 2>/dev/null || true
          cp screenshots.log "$RESULTS/" 2>/dev/null || true
          cp shots/*.png "$RESULTS/shots/" 2>/dev/null || true
          # Full-size screenshots are 2 MB each; 1434 px tall is plenty to judge them.
          for shot in "$RESULTS"/shots/*.png; do sips -Z 1434 "$shot" >/dev/null 2>&1 || true; done
          cd "$RESULTS"
          git init -q
          git checkout -q -b results
          git add -A
          git -c user.name="ios-native-check" -c user.email="actions@users.noreply.github.com" \
            commit -q -m "Results for $GITHUB_SHA"
          pushed=""
          for attempt in 1 2 3; do
            if git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" \
                "HEAD:refs/heads/ci/${{ github.ref_name }}-results" > "$RUNNER_TEMP/push.log" 2>&1; then
              pushed=yes
              break
            fi
            sleep 15
          done
          if [ -z "$pushed" ]; then
            # The run's summary page is public, unlike its logs.
            {
              echo "### Handing the results back failed"
              echo '```'
              tail -n 30 "$RUNNER_TEMP/push.log"
              du -sh "$RESULTS"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
